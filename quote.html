<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Novo's Cleaning | Get your estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0D0D0D}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
a{color:#C8F400}
button{font-family:inherit;color:#fff;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100%;height:100%;display:flex;flex-direction:column;background:#0D0D0D}
header{padding:14px 20px 12px;border-bottom:1px solid #262626;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;justify-content:space-between}
.hrow img{height:52px;width:auto;display:block}
.steptxt{font-size:13px;font-weight:700;color:#A3A3A3}
.bar{height:6px;border-radius:3px;background:#262626;overflow:hidden}
.bar>div{height:6px;border-radius:3px;background:#C8F400;transition:width .4s ease}
main{flex:1;overflow-y:auto;padding:22px 20px 28px;-webkit-overflow-scrolling:touch}
footer{padding:14px 20px 18px;border-top:1px solid #262626;display:flex;gap:10px;background:#0D0D0D}
.col{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g16{gap:16px}.g20{gap:20px}.g22{gap:22px}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.sub{margin:0;font-size:15px;line-height:1.45;color:#A3A3A3}
.lbl{font-size:14px;font-weight:700}
.lbl span{font-weight:500;color:#A3A3A3}
.note{font-size:12px;line-height:1.45;color:#A3A3A3}
.center{text-align:center}
.grid{display:grid;gap:6px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c7{grid-template-columns:repeat(7,minmax(0,1fr))}
.g8.grid{gap:8px}.g10.grid{gap:10px}
.opt{border:1px solid #333;background:#1A1A1A;border-radius:11px;cursor:pointer;font-weight:700;font-size:15px;min-height:46px;padding:0 6px}
.opt.on{border:2px solid #C8F400;background:#232B00}
.opt.left{text-align:left;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.tag{font-size:12.5px;font-weight:800;color:#C8F400;white-space:nowrap}
.svc{min-height:118px;padding:14px 12px;border-radius:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}
.svc .ic{width:36px;height:36px;border-radius:10px;background:#262626;display:flex;align-items:center;justify-content:center}
.svc .ic svg{stroke:#C8F400}
.svc.on .ic{background:#C8F400}.svc.on .ic svg{stroke:#0D0D0D}
.svc b{font-size:15px;font-weight:800}
.svc small,.cnd small{font-size:11.5px;font-weight:500;line-height:1.3;color:#A3A3A3}
.cnd{min-height:60px;padding:10px 12px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;text-align:left}
.cnd b{font-size:14px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field input{height:48px;padding:0 14px;border-radius:12px;border:1px solid #3A3A3A;background:#1A1A1A;color:#fff;font-family:inherit;font-size:16px;min-width:0;width:100%}
.field input:focus{outline:none;border-color:#C8F400}
.field input.bad{border-color:#EF4444}
.err{font-size:12px;color:#F87171;font-weight:600}
input::placeholder{color:#7A7A7A}
.card{background:#161616;border:1px solid #2A2A2A;border-radius:14px;padding:14px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.6px;color:#A3A3A3}
.lime{color:#C8F400}
.scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#222}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1);transition:opacity .6s ease,transform 3.5s ease-out}
.scene img.show{opacity:1;transform:scale(1.06)}
.pill{position:absolute;left:10px;top:10px;padding:5px 10px;border-radius:999px;background:#0D0D0D;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:4px;display:block;transition:background-color .5s}
.ex{position:absolute;right:10px;bottom:8px;padding:3px 8px;border-radius:6px;background:rgba(13,13,13,.72);color:#D4D4D4;font-size:10.5px;font-weight:600}
.meter{height:8px;border-radius:4px;background:#2A2A2A;overflow:hidden}
.meter>div{height:8px;border-radius:4px;transition:width .5s ease,background-color .5s ease}
.row{display:flex;gap:10px;align-items:baseline}
.row .k{width:78px;flex-shrink:0;font-size:12px;font-weight:800}
.row .v{font-size:13px;line-height:1.4;color:#C7C7C7}
.est{padding:18px;border-radius:18px;background:#C8F400;color:#0D0D0D;display:flex;flex-direction:column;gap:12px}
.est .kick{font-size:12px;font-weight:800;letter-spacing:.6px;color:#2E3800}
.est .big{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-1px}
.est .s{font-size:13px;line-height:1.4;font-weight:700;color:#1F2600}
.est .lines{border-top:1px solid #A3C700;padding-top:10px;display:flex;flex-direction:column;gap:5px}
.est .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#1F2600}
.est .ln b{color:#0D0D0D;white-space:nowrap}
.recap{padding:2px 14px}
.recap div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:13px;border-bottom:1px solid #262626}
.recap div:last-child{border-bottom:0}
.recap span{color:#A3A3A3;flex-shrink:0}.recap b{text-align:right}
.day{height:70px;padding:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day span{font-size:11px;font-weight:700;color:#A3A3A3}.day.on span{color:#C8F400}
.day b{font-size:20px;font-weight:800;line-height:1}
.win{height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.win b{font-size:15px;font-weight:800}.win span{font-size:11px;font-weight:600;color:#A3A3A3}
.slotbox{padding:14px 16px;border-radius:14px;background:#232B00;border:1px solid #C8F400;display:flex;align-items:center;gap:12px}
.status{padding:16px;border-radius:16px;background:#C8F400;color:#0D0D0D;display:flex;align-items:center;gap:14px}
.status .ph{width:48px;height:48px;border-radius:24px;background:#0D0D0D;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.track{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.track .ln0,.track .ln1{position:absolute;left:10%;top:15px;height:2px}
.track .ln0{right:10%;background:#333}.track .ln1{background:#C8F400}
.tstep{position:relative;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px}
.dot{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.dot.done{background:#C8F400}
.dot.now{background:#0D0D0D;border:2px solid #C8F400;color:#C8F400}
.dot.later{background:#1A1A1A;border:1px solid #3A3A3A;color:#A3A3A3}
.tstep em{font-style:normal;font-size:11.5px;line-height:1.2;font-weight:800;text-align:center}
.tstep u{width:18px;height:3px;border-radius:2px;background:transparent;text-decoration:none;display:block}
.tstep.sel u{background:#C8F400}
.badge{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}
.pulse{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,244,0,.55)}70%{box-shadow:0 0 0 12px rgba(200,244,0,0)}100%{box-shadow:0 0 0 0 rgba(200,244,0,0)}}
.back{width:56px;height:54px;border-radius:14px;border:1px solid #3A3A3A;background:#1A1A1A;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.next{flex:1;height:54px;border-radius:14px;border:0;background:#C8F400;color:#0D0D0D;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.next.off{background:#2A2A2A;color:#7A7A7A;cursor:not-allowed}
.next:disabled{opacity:.7}
@media (prefers-reduced-motion:reduce){.scene img{transition:none}.pulse{animation:none}}
</style>
</head>

function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function isCom() { return S.svc === 'Commercial'; }

function isCustom() { return isCom() || isExtreme(); }
function wantsSlot() { return !isCom() && (S.when === 'ASAP' || S.when === 'This week'); }
function pages() {

function quote() {
  var bed = PRICES.bed[S.svc][PRICES.bedKeys.indexOf(S.beds)];
  var bath = PRICES.bath[S.svc][PRICES.bathKeys.indexOf(S.baths)];
  var clean = Math.max(bed + bath, PRICES.min[S.svc]);
  var heavy = S.cond === 'C' ? PRICES.heavyFee[S.svc] : 0;
  var rate = S.svc === 'Standard' ? PRICES.discount[S.freq] || 0 : 0;
  var disc = clean * rate;
  return { clean:clean, heavy:heavy, disc:disc, rate:rate, total:clean + heavy - disc, recurring:clean - disc };
}
function addonNames() { return PRICES.extras.filter(function (e) { return S.extras[e[0]] && e[1] !== S.svc; }).map(function (e) { return e[0]; }); }

function firstName() { return (S.name || '').trim().split(/\s+/)[0]; }
function days() {

  while (out.length < 7) { d.setDate(d.getDate() + 1); if (CLOSED_DAYS.indexOf(d.getDay()) === -1) out.push(new Date(d.getTime())); }
  return out;
}
function slotLabel() { var d = days()[Math.min(S.slotDay, 6)]; return WK[d.getDay()] + ', ' + MO[d.getMonth()] + ' ' + d.getDate() + ' · ' + S.slotWin; }

function opts(list, key, cls, tags) {

}

}

  catch (e) { return new Date().getHours(); }
}
// null = we call in 5 min; 'tomorrow' = after CALL_END_HOUR; 'today' = after midnight, before CALL_START_HOUR
function afterHours() {
  var h = localHour();
  if (h >= CALL_END_HOUR) return 'tomorrow';
  if (h < CALL_START_HOUR) return 'today';
  return null;
}
function callWhen() { var a = afterHours(); return a === 'tomorrow' ? 'first thing tomorrow morning' : (a === 'today' ? 'first thing this morning' : 'within 5 minutes'); }
function countdown() {
  if (afterHours()) return "Our team is off for the night. Keep your phone handy in the morning!";
  var left = S.doneAt ? Math.max(0, 300 - Math.floor((Date.now() - S.doneAt) / 1000)) : 300;
  return left > 0 ? 'Expect our call in ' + Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2) + '. Keep your phone close!' : 'Calling you any second now. Keep your phone close!';
}

/* ---------------- render ---------------- */
function render(scrollTop) {
  var p = pages(), i = p.indexOf(S.page); if (i < 0) { S.page = 'svc'; i = 0; }
  var qCount = p.indexOf('est');
  var cur = i + 1;
  document.getElementById('steptxt').textContent = cur <= qCount ? 'Step ' + cur + ' of ' + qCount : (S.page === 'est' ? 'Your estimate' : 'All set');
  document.getElementById('bar').style.width = Math.round(Math.min(cur, qCount) / qCount * 100) + '%';
  var main = document.getElementById('main');
  main.innerHTML = VIEW[S.page]();
  if (scrollTop) main.scrollTop = 0;

  var foot = '';
  if (S.page !== 'done') {
    if (i > 0) foot += '<button type="button" class="back" data-nav="back" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>';
    var blocked = S.page === 'svc' && !S.when;
    var label = blocked ? 'Pick when you need us' : (S.page === 'freq' ? (isCustom() ? 'See my next step' : 'See my estimate') : (S.page === 'est' ? (S.sending ? 'Sending...' : 'Submit my request') : 'Continue'));
    foot += '<button type="button" class="next' + (blocked ? ' off' : '') + '" data-nav="next"' + (blocked ? ' aria-disabled="true"' : '') + (S.sending ? ' disabled' : '') + '>' + label + '</button>';
  } else {
    foot = '<a class="next" href="' + PHONE_LINK + '">' + PHONE_SVG('#0D0D0D') + "Can't wait? Call us now</a>";
  }
  document.getElementById('foot').innerHTML = foot;
}

function updateCond() {
  var lv = LEVEL[S.cond], idx = KEYS.indexOf(S.cond);
  var imgs = document.querySelectorAll('#scene img');
  for (var i = 0; i < imgs.length; i++) imgs[i].className = i === idx ? 'show' : '';
  document.getElementById('scene').setAttribute('aria-label', lv.alt);
  document.getElementById('pilldot').style.background = lv.c;
  document.getElementById('pilltxt').textContent = COND[S.cond];
  document.getElementById('mlabel').textContent = lv.m;
  document.getElementById('mlabel').style.color = lv.c;
  document.getElementById('mfill').style.width = lv.w;
  document.getElementById('mfill').style.background = lv.c;
  document.getElementById('cname').textContent = COND[S.cond];
  document.getElementById('crows').innerHTML = condRows(lv);
  var bs = document.querySelectorAll('[data-cond]');
  for (var j = 0; j < bs.length; j++) { var on = bs[j].getAttribute('data-cond') === S.cond; bs[j].classList.toggle('on', on); bs[j].setAttribute('aria-pressed', on); }
}

/* ---------------- validation + sending ---------------- */
function validContact() {
  var e = {};
  if (!S.name.trim()) e.name = 'Please enter your name.';
  if (S.phone.replace(/\D/g, '').length < 10) e.phone = 'Please enter a 10-digit phone number.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email.trim())) e.email = 'Please enter a valid email.';
  if (!S.street.trim()) e.street = 'Please enter your address.';
  if (!S.city.trim()) e.city = 'Please enter your city.';
  if (!/^\d{5}$/.test(S.zip.trim())) e.zip = 'Enter a 5-digit ZIP.';
  S.errors = e;
  return !Object.keys(e).length;
}
function payload(stage) {
  var custom = isCustom(), q = (custom || stage === 'partial') ? null : quote();
  var parts = S.name.trim().split(/\s+/);
  return {
    stage: stage,                                     // "partial" or "submitted"
    submitted_at: new Date().toISOString(),
    first_name: parts[0] || '', last_name: parts.slice(1).join(' '), full_name: S.name.trim(),
    phone: S.phone.trim(), email: S.email.trim(), address: S.street.trim(), city: S.city.trim(), zip: S.zip.trim(),
    service: svcInfo().full, timing: S.when,
    requested_slot: wantsSlot() ? slotLabel() : '',
    bedrooms: isCom() ? '' : S.beds, bathrooms: isCom() ? '' : S.baths,
    square_feet: isCom() ? S.comSqft : S.sqft,
    condition: isCom() ? '' : COND[S.cond],
    business_type: isCom() ? S.biz : '', restrooms: isCom() ? S.rest : '',
    frequency: S.freq, add_ons: isCom() ? '' : addonNames().join(', '),
    estimate: q ? Math.round(q.total) : '', estimate_recurring: (q && S.svc === 'Standard' && S.freq !== 'One-time') ? Math.round(q.recurring) : '',
    quote_type: custom ? 'custom' : 'instant',
    after_hours: !!afterHours(),
    page_url: location.href
  };
}
// Netlify Forms: every lead also lands in Netlify > Forms > "quote" (same as the old form).
function sendNetlify(stage) {
  var d = payload(stage);
  // keep the old form's field names filled so existing notifications/zaps still work
  d.name = d.full_name; d.street = d.address; d.beds = d.bedrooms; d.baths = d.bathrooms;
  d.sqft = d.square_feet; d.addons = d.add_ons || 'None';
  d.estimate_value = d.estimate === '' ? 0 : d.estimate;
  if (d.estimate === '') d.estimate = stage === 'partial' ? 'Partial lead (contact info only)' : 'Custom quote / walkthrough needed';
  else d.estimate = '$' + d.estimate;
  var f = { 'form-name': 'quote' };
  Object.keys(d).forEach(function (k) { f[k] = String(d[k]); });
  return fetch('/', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(f).toString() }).catch(function () {});
}
function send(stage) {
  var nf = sendNetlify(stage);
  if (!WEBHOOK_URL) return nf;
  var body = JSON.stringify(payload(stage));
  // Try a normal JSON POST first. If the webhook host blocks cross-site requests,
  // fall back to a "fire and forget" POST (same JSON, sent as plain text).
  return fetch(WEBHOOK_URL, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: body })
    .catch(function () {
      return fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: body });
    })
    .catch(function () {});
}

/* ---------------- events ---------------- */
function go(dir) {
  var p = pages(), i = p.indexOf(S.page);
  if (dir < 0) { S.page = p[Math.max(0, i - 1)]; S.errors = {}; render(true); return; }
  if (S.page === 'svc' && !S.when) return;
  if (S.page === 'contact') {
    if (!validContact()) { render(false); var f = document.querySelector('input.bad'); if (f) f.focus(); return; }
    if (!S.partialSent) { S.partialSent = true; send('partial'); }
  }
  if (S.page === 'est') {
    S.sending = true; render(false);
    send('submitted').then(function () {
      S.sending = false; S.page = 'done'; S.doneAt = Date.now(); S.tlSel = wantsSlot() ? 2 : 1;
      try { if (window.fbq) window.fbq('track', 'Lead'); else if (window.parent && window.parent !== window && window.parent.fbq) window.parent.fbq('track', 'Lead'); } catch (e) {}
      if (window.parent && window.parent !== window) { try { window.parent.postMessage({ type: 'novos-quote-submitted' }, '*'); } catch (e) {} }
      render(true);
    });
    return;
  }
  S.page = p[Math.min(p.length - 1, i + 1)];
  render(true);
}

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('button,[data-nav]'); if (!b) return;
  if (b.hasAttribute('data-nav')) { go(b.getAttribute('data-nav') === 'back' ? -1 : 1); return; }
  if (b.hasAttribute('data-cond')) { S.cond = b.getAttribute('data-cond'); updateCond(); return; }
  if (b.hasAttribute('data-extra')) { var n = b.getAttribute('data-extra'); S.extras[n] = !S.extras[n]; render(false); return; }
  if (b.hasAttribute('data-day')) { S.slotDay = +b.getAttribute('data-day'); render(false); return; }
  if (b.hasAttribute('data-tl')) { S.tlSel = +b.getAttribute('data-tl'); render(false); return; }
  if (b.hasAttribute('data-k')) { S[b.getAttribute('data-k')] = b.getAttribute('data-v'); render(false); }
});
document.addEventListener('input', function (ev) {
  var f = ev.target.getAttribute && ev.target.getAttribute('data-f'); if (!f) return;
  S[f] = ev.target.value;
  if (S.errors[f]) { delete S.errors[f]; ev.target.classList.remove('bad'); var er = ev.target.parentNode.querySelector('.err'); if (er) er.remove(); }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); go(1); }
});
setInterval(function () { if (S.page === 'done') { var c = document.getElementById('countdown'); if (c) c.textContent = countdown(); } }, 1000);

render(true);
</script>
</body>
</html>
